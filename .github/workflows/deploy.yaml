name: Financial App Deployment

on:
    pull_request:
        types: [opened, synchronize, reopened]
        branches:
            - main
            - develop
                
    push:
        branches:
            - main
            - develop
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                    distribution: 'temurin'
                    java-version: '21'
                    cache: 'maven'
            
            - name: Install dependencies
              run: mvn clean install -DskipTests

            - name: Package application
              run: mvn -B clean package -DskipTests

            - name: Upload JAR artifact
              uses: actions/upload-artifact@v4
              with:
                    name: financial-app
                    path: target/*.jar

    test: 
        env:
            DB_URL: jdbc:mysql://127.0.0.1:3306/financial
            DB_USER_NAME: appuser
            DB_PASSWORD: 123456
            FFLYWAY_ENABLED: true
            FLYWAY_LOCATIONS: classpath:db/migration
                    
        runs-on: ubuntu-latest
        services:
          mysql:
            image: mysql:8.4
            env:
                MYSQL_ROOT_PASSWORD: 123456
                MYSQL_DATABASE: financial
                MYSQL_USER: appuser
                MYSQL_PASSWORD: 123456
            ports:
                - 3306:3306
            options: >-
                --health-cmd="mysqladmin ping --silent"
                --health-interval=10s
                --health-timeout=5s
                --health-retries=3

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                    distribution: 'temurin'
                    java-version: '21'
                    cache: 'maven'
            - name: Wait for MySQL
              run: |
                for i in {1..30}; do
                if mysqladmin ping -h 127.0.0.1 -P 3306 -u appuser -p123456 --silent; then
                    echo "MySQL is ready"
                    break
                fi
                echo "Waiting for MySQL... ($i/30)"
                sleep 2
                done
            
            - name: Flyway Migrations
              run: mvn -B flyway:migrate \
                -Dflyway.url=jdbc:mysql://127.0.0.1:3306/financial \
                -Dflyway.user=appuser \
                -Dflyway.password=123456
            - name: Run tests with coverage
              run: mvn -B clean test

            - name: Upload test results
              uses: actions/upload-artifact@v4
              with:
                    name: test-coverage-report
                    path: target/site/jacoco/

    dockerize:
        runs-on: ubuntu-latest
        needs: 
            - build
            - test

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
            
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker Image
              run: docker build --platform linux/amd64 -t financial-app:latest .
        